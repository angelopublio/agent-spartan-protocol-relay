id = "spartan-relay"
name = "Spartan Relay"
version = "0.1.1"
min_herdr_version = "0.9.0"
description = "Open a repository's cockpit and relay workspace, run the Agent Spartan Protocol relay on its active task, and install the Cursor detection fix."
platforms = ["macos", "linux"]

[[actions]]
id = "open-workspace"
title = "Spartan: open workspace for this repository"
contexts = ["pane"]
command = ["node", "actions/open-workspace.mjs"]

[[actions]]
id = "run-relay"
title = "Spartan: run relay on the active task"
contexts = ["pane"]
command = ["node", "actions/run-relay.mjs"]

[[actions]]
id = "open-cockpit"
title = "Spartan: open cockpit pane"
contexts = ["pane"]
command = ["node", "actions/open-cockpit.mjs"]

[[actions]]
id = "install-cursor-detection"
title = "Spartan: install Cursor detection fix"
contexts = ["pane"]
command = ["node", "actions/install-cursor-detection.mjs"]
